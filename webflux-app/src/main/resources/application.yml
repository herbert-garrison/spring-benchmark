server:
  port: 8081

spring:
  application:
    name: webflux-benchmark

  r2dbc:
    url: r2dbc:postgresql://<TODO_HOST>:5432/benchmark
    username: benchmark
    password: benchmark
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 10m
      validation-query: SELECT 1

  kafka:
    bootstrap-servers: <TODO_HOST>:9092

s3:
  endpoint: <TODO_HOST>
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1
  bucket: benchmark-bucket

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      app: webflux-benchmark
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    com.benchmark: INFO
